<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Agora files</title>
<!--
  Agora: a circle's Files page, when the files are in Infomaniak kDrive.

  Members of the circle see its folder in 7BP's kDrive: folders and files,
  their size, when they changed and who added them in Agora. They open
  folders, download files, add files (several at once, or dropped on the
  list), and make folders. The member who added something, and the circle's
  stewards, can rename and delete it. The server checks all of this again
  for every call (api/controllers/AgoraKdriveController.js).

  The browser never talks to kDrive itself: files come and go through Agora,
  which passes them on as they arrive.

  Plain HTML, CSS and JavaScript on purpose, like the meeting room, so it can
  be read and changed without building the rest of the web app. The texts are
  below in six languages (TEXTS), chosen by the language of the person's Agora
  account. The server fills in the BOOT value with the circle's details.
-->
<style>
  :root {
    --bg: #f5f3f6;
    --surface: #ffffff;
    --ink: #1d1a22;
    --muted: #6b6573;
    --line: #dfdbe4;
    --accent: #c2255c;
    --warn: #b35c00;
    --radius: 10px;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121016;
      --surface: #1c1922;
      --ink: #efecf3;
      --muted: #a39cae;
      --line: #322d3b;
      --accent: #f06595;
      --warn: #ffa94d;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
  [hidden] { display: none !important; }
  a { color: var(--accent); }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; margin-bottom: 16px; }
  h1 { margin: 0; font-size: 22px; }
  .back { font-size: 14px; }
  nav.trail { display: flex; flex-wrap: wrap; gap: 4px; font-size: 14px; color: var(--muted); margin-bottom: 12px; }
  nav.trail button { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .row { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
  .kind { width: 44px; height: 32px; border-radius: 8px; display: grid; place-items: center; font-size: 10px; font-weight: 600; color: #fff; }
  .name { font: inherit; color: inherit; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; overflow-wrap: anywhere; text-decoration: none; }
  .name:hover { text-decoration: underline; }
  .meta { display: block; font-size: 13px; color: var(--muted); }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .actions button, .actions a { font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; }
  .actions button.danger { color: var(--warn); }
  .message { padding: 20px; }
  .message p { margin: 0 0 8px; }
  .message p:last-child { margin-bottom: 0; }
  .message.warn { color: var(--warn); }
  footer { margin-top: 12px; font-size: 13px; color: var(--muted); }
  .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
  .tools button { font: inherit; font-size: 14px; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
  .tools button.plain { background: var(--surface); color: var(--accent); }
  .tools button:disabled { opacity: .5; cursor: default; }
  .tools .status { font-size: 14px; color: var(--muted); }
  .tools .status.warn { color: var(--warn); }
  .panel.dropping { outline: 2px dashed var(--accent); outline-offset: 2px; }
  @media (max-width: 560px) {
    .row { grid-template-columns: 44px 1fr; }
    .actions { grid-column: 2; justify-content: flex-start; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">Files</h1>
    <a class="back" id="back" href="#">Back to the circle</a>
  </header>
  <nav class="trail" id="trail" hidden></nav>
  <div class="tools" id="tools" hidden>
    <button type="button" id="add-files">Add files</button>
    <button type="button" class="plain" id="new-folder">New folder</button>
    <input type="file" id="file-input" multiple hidden>
    <span class="status" id="status" role="status" aria-live="polite"></span>
  </div>
  <div class="panel" id="panel">
    <div class="message" id="message">Loading the files…</div>
    <div id="list" hidden></div>
  </div>
  <footer id="footer" hidden></footer>
</main>

  const LANG = TEXTS[BOOT.locale] ? BOOT.locale : 'en';
  document.documentElement.lang = LANG;

  /** A text in the person's language, with {name} filled in. */
  function t (key, values) {
    const text = TEXTS[LANG][key] || TEXTS.en[key] || key;
    return text.replace(/\{(\w+)\}/g, (all, name) => (values && values[name] !== undefined ? String(values[name]) : all));
  }

  const $ = id => document.getElementById(id);
  // The trail of folders opened so far, starting with the circle's own folder.
  let trail = [];
  // The folder shown now: null for the circle's own folder, or a folder's number.
  let current = null;
  let maxUploadMb = 100;
  let busy = false;

  function el (tag, attrs, text) {
    const node = document.createElement(tag);
    Object.assign(node, attrs || {});
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function when (iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleDateString(LANG, { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function size (bytes) {
    if (bytes === null || bytes === undefined) return '';
    const units = ['B', 'KB', 'MB', 'GB', 'TB'];
    let n = Number(bytes);
    let i = 0;
    while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
    return n.toLocaleString(LANG, { maximumFractionDigits: i === 0 ? 0 : 1 }) + ' ' + units[i];
  }

  function showMessage (lines, warn) {
    $('list').hidden = true;
    $('footer').hidden = true;
    const box = $('message');
    box.hidden = false;
    box.className = 'message' + (warn ? ' warn' : '');
    box.replaceChildren(...lines.map(line => el('p', {}, line)));
  }

  function setStatus (text, warn) {
    const status = $('status');
    status.textContent = text || '';
    status.className = 'status' + (warn ? ' warn' : '');
  }

  function setBusy (value) {
    busy = value;
    $('add-files').disabled = value;
    $('new-folder').disabled = value;
  }

  function showTrail () {
    const nav = $('trail');
    nav.hidden = trail.length < 2;
    nav.replaceChildren();
    trail.forEach((folder, i) => {
      if (i > 0) nav.append(el('span', {}, '/'));
      if (i === trail.length - 1) {
        nav.append(el('span', {}, folder.name));
      } else {
        const button = el('button', { type: 'button' }, folder.name);
        button.addEventListener('click', () => { trail = trail.slice(0, i + 1); load(folder.isCircleFolder ? null : folder.id); });
        nav.append(button);
      }
    });
  }

  async function post (path, body) {
    try {
      const res = await fetch(BOOT.api + path, {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', 'X-Agora': '1' },
        body: JSON.stringify(body)
      });
      const data = await res.json().catch(() => ({}));
      return { ok: res.ok, data };
    } catch (e) {
      return { ok: false, data: { error: t('offline') } };
    }
  }

  function showItems (items) {
    $('message').hidden = true;
    const list = $('list');
    list.hidden = false;
    list.replaceChildren();
    if (!items.length) list.append(el('div', { className: 'message' }, t('empty')));
    for (const item of items) {
      const isFolder = item.kind === 'folder';
      const row = el('div', { className: 'row' });
      const badge = el('span', { className: 'kind' }, isFolder ? t('folder') : t('file'));
      badge.style.background = isFolder ? '#7a6f86' : '#2f6fde';
      const downloadUrl = BOOT.api + '/download?file=' + encodeURIComponent(item.id);
      let name;
      if (isFolder) {
        name = el('button', { type: 'button', className: 'name' }, item.name);
        name.addEventListener('click', () => { trail.push({ id: item.id, name: item.name }); load(item.id); });
      } else {
        name = el('a', { className: 'name', href: downloadUrl }, item.name);
        name.setAttribute('download', '');
      }
      const meta = el('span', { className: 'meta' }, [
        isFolder ? '' : size(item.size),
        when(item.changedAt),
        item.addedBy ? t('addedBy', { name: item.addedBy }) : ''
      ].filter(Boolean).join(' · '));
      const middle = el('span');
      middle.append(name, meta);
      const actions = el('span', { className: 'actions' });
      if (!isFolder) {
        const link = el('a', { href: downloadUrl }, t('download'));
        link.setAttribute('download', '');
        actions.append(link);
      }
      if (item.canChange) {
        const rename = el('button', { type: 'button' }, t('rename'));
        rename.addEventListener('click', () => renameItem(item));
        const remove = el('button', { type: 'button', className: 'danger' }, t('remove'));
        remove.addEventListener('click', () => removeItem(item));
        actions.append(rename, remove);
      }
      row.append(badge, middle, actions);
      list.append(row);
    }
    $('footer').textContent = t('footer');
    $('footer').hidden = false;
  }

  // Sends one file to Agora, which passes it on to kDrive. XMLHttpRequest, because only it reports progress.
  function sendFile (file, onProgress) {
    return new Promise(resolve => {
      const xhr = new XMLHttpRequest();
      const params = '?name=' + encodeURIComponent(file.name) + (current ? '&folder=' + encodeURIComponent(current) : '');
      xhr.open('POST', BOOT.api + '/upload' + params);
      xhr.withCredentials = true;
      // Sent as plain bytes, so the server never reads the file as a form or as JSON.
      xhr.setRequestHeader('Content-Type', 'application/octet-stream');
      xhr.setRequestHeader('X-Agora', '1');
      xhr.upload.onprogress = e => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
      xhr.onload = () => {
        let body = {};
        try { body = JSON.parse(xhr.responseText); } catch (e) {}
        resolve(xhr.status >= 200 && xhr.status < 300 ? { ok: true } : { ok: false, error: body.error || t('failed') });
      };
      xhr.onerror = () => resolve({ ok: false, error: t('offline') });
      xhr.send(file);
    });
  }

  async function addFiles (files) {
    if (busy || !files.length) return;
    const limit = maxUploadMb * 1048576;
    const good = files.filter(f => f.size > 0 && f.size <= limit);
    const problems = []
      .concat(files.filter(f => f.size > limit).map(f => t('tooLarge', { name: f.name, mb: maxUploadMb })))
      .concat(files.filter(f => f.size === 0).map(f => t('emptyFile', { name: f.name })));
    setBusy(true);
    let added = 0;
    for (let i = 0; i < good.length; i++) {
      const file = good[i];
      const label = good.length > 1 ? t('addingOf', { name: file.name, i: i + 1, n: good.length }) : t('adding', { name: file.name });
      setStatus(label);
      const result = await sendFile(file, part => setStatus(label + ' ' + t('progress', { pct: Math.round(part * 100) })));
      if (result.ok) added++;
      else problems.push(file.name + ': ' + result.error);
    }
    setBusy(false);
    if (problems.length) setStatus(problems.join(' '), true);
    else if (good.length) setStatus(good.length === 1 ? t('added') : t('addedMany', { n: good.length }));
    if (added) load(current, true);
  }

  async function newFolder () {
    if (busy) return;
    const name = (window.prompt(t('folderPrompt')) || '').trim();
    if (!name) return;
    setBusy(true);
    setStatus(t('makingFolder'));
    const res = await post('/folder', { name, folder: current || '' });
    setBusy(false);
    if (!res.ok) return setStatus(res.data.error || t('failed'), true);
    setStatus(t('folderMade'));
    load(current, true);
  }

  async function renameItem (item) {
    if (busy) return;
    const name = (window.prompt(t('renamePrompt'), item.name) || '').trim();
    if (!name || name === item.name) return;
    setBusy(true);
    const res = await post('/rename', { item: item.id, name });
    setBusy(false);
    if (!res.ok) return setStatus(res.data.error || t('failed'), true);
    setStatus(t('renamed'));
    load(current, true);
  }

  async function removeItem (item) {
    if (busy || !window.confirm(t('removeConfirm', { name: item.name }))) return;
    setBusy(true);
    const res = await post('/delete', { item: item.id });
    setBusy(false);
    if (!res.ok) return setStatus(res.data.error || t('failed'), true);
    setStatus(t('removed'));
    load(current, true);
  }

  // Leaving the page stops an upload halfway, so the browser asks first.
  window.addEventListener('beforeunload', e => { if (busy) { e.preventDefault(); e.returnValue = t('leaveWarning'); } });

  async function load (folderId, keepStatus) {
    current = folderId || null;
    if (!keepStatus) setStatus('');
    $('tools').hidden = true;
    showMessage([t('loading')]);
    let body;
    try {
      const res = await fetch(BOOT.api + '/list' + (folderId ? '?folder=' + encodeURIComponent(folderId) : ''), { credentials: 'same-origin' });
      body = await res.json().catch(() => ({}));
      if (res.status === 409 && !body.folder) return showMessage([t('notConnected')]);
      if (!res.ok) return showMessage([body.error || t('loadFailed')], true);
    } catch (e) {
      return showMessage([t('offline')], true);
    }
    if (trail.length === 0) trail = [body.folder];
    else trail[trail.length - 1] = { ...trail[trail.length - 1], ...body.folder };
    if (body.maxUploadMb) maxUploadMb = body.maxUploadMb;
    $('tools').hidden = false;
    showTrail();
    showItems(body.items || []);
  }

  $('add-files').addEventListener('click', () => $('file-input').click());
  $('file-input').addEventListener('change', e => {
    const files = Array.from(e.target.files || []);
    e.target.value = '';
    addFiles(files);
  });
  $('new-folder').addEventListener('click', newFolder);

  // Files can also be dropped on the list.
  const panel = $('panel');
  panel.addEventListener('dragover', e => {
    if (busy || $('tools').hidden) return;
    e.preventDefault();
    panel.classList.add('dropping');
  });
  panel.addEventListener('dragleave', () => panel.classList.remove('dropping'));
  panel.addEventListener('drop', e => {
    panel.classList.remove('dropping');
    if (busy || $('tools').hidden) return;
    e.preventDefault();
    addFiles(Array.from((e.dataTransfer && e.dataTransfer.files) || []));
  });

  document.title = t('title', { circle: BOOT.circleName }) + ' · Agora';
  $('title').textContent = t('title', { circle: BOOT.circleName });
  $('back').textContent = t('back');
  $('back').href = BOOT.circleUrl;
  $('add-files').textContent = t('addFiles');
  $('new-folder').textContent = t('newFolder');
  load(null);
</script>
</body>
</html>
