<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agora files</title>
<!--
  Agora: a circle's Files page.

  Shows what is in the circle's Google Drive folder: names, who changed a file
  last and when. Clicking a file opens it in Google Drive, where Drive decides
  whether you may read or edit it. Clicking a folder opens it here.

  When adding is switched on (AGORA_DRIVE_UPLOADS=on), members of the circle
  see "Add files", "New folder" and "My folder", and can drop files on the
  list. The browser sends each file straight to Google Drive, in pieces of
  8 MB, to a one-time address Agora asks Google for. Agora does not keep a copy.

  Plain HTML, CSS and JavaScript on purpose, like the meeting room, so it can
  be read and changed without building the rest of the web app.

  The server fills in the BOOT value below with the circle's details.
-->
<style>
  :root {
    --bg: #f5f3f6;
    --surface: #ffffff;
    --ink: #1d1a22;
    --muted: #6b6573;
    --line: #dfdbe4;
    --accent: #c2255c;
    --warn: #b35c00;
    --radius: 10px;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121016;
      --surface: #1c1922;
      --ink: #efecf3;
      --muted: #a39cae;
      --line: #322d3b;
      --accent: #f06595;
      --warn: #ffa94d;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
  [hidden] { display: none !important; }
  a { color: var(--accent); }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; margin-bottom: 16px; }
  h1 { margin: 0; font-size: 22px; }
  .back { font-size: 14px; }
  nav.trail { display: flex; flex-wrap: wrap; gap: 4px; font-size: 14px; color: var(--muted); margin-bottom: 12px; }
  nav.trail button { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
  nav.trail span.sep { color: var(--muted); }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .row { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; width: 100%; padding: 10px 14px; border: 0; border-top: 1px solid var(--line); background: none; font: inherit; color: inherit; text-align: left; text-decoration: none; cursor: pointer; }
  .row:first-child { border-top: 0; }
  .row:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
  .kind { width: 44px; height: 32px; border-radius: 8px; display: grid; place-items: center; font-size: 10px; font-weight: 600; color: #fff; }
  .name { overflow-wrap: anywhere; }
  .when { font-size: 13px; color: var(--muted); text-align: right; white-space: nowrap; }
  .when small { display: block; }
  .message { padding: 20px; }
  .message p { margin: 0 0 8px; }
  .message p:last-child { margin-bottom: 0; }
  .message.warn { color: var(--warn); }
  .open-drive { font-size: 14px; }
  footer { margin-top: 12px; font-size: 13px; color: var(--muted); }
  .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
  .tools button { font: inherit; font-size: 14px; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
  .tools button.plain { background: var(--surface); color: var(--accent); }
  .tools button:disabled { opacity: .5; cursor: default; }
  .tools .status { font-size: 14px; color: var(--muted); }
  .tools .status.warn { color: var(--warn); }
  .panel.dropping { outline: 2px dashed var(--accent); outline-offset: 2px; }
  @media (max-width: 520px) {
    .row { grid-template-columns: 44px 1fr; }
    .when { grid-column: 2; text-align: left; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">Files</h1>
    <a class="back" id="back" href="#">Back to the circle</a>
  </header>
  <nav class="trail" id="trail" hidden></nav>
  <div class="tools" id="tools" hidden>
    <button type="button" id="add-files">Add files</button>
    <button type="button" class="plain" id="new-folder">New folder</button>
    <button type="button" class="plain" id="my-folder" title="The folder with your name here. It is made the first time.">My folder</button>
    <input type="file" id="file-input" multiple hidden>
    <span class="status" id="status" role="status" aria-live="polite"></span>
  </div>
  <div class="panel" id="panel">
    <div class="message" id="message">Loading the files…</div>
    <div id="list" hidden></div>
  </div>
  <footer id="footer" hidden>
    Files open in Google Drive. If Drive says you have no access, ask the circle for it.
    <a class="open-drive" id="open-drive" href="#" target="_blank" rel="noopener noreferrer">Open this folder in Google Drive</a>
  </footer>
</main>
<script>
  const BOOT = "__AGORA_BOOT__";

  const KINDS = {
    folder: ['Folder', '#7a6f86'],
    document: ['Doc', '#2f6fde'],
    spreadsheet: ['Sheet', '#1e8e3e'],
    presentation: ['Slides', '#e8a400'],
    form: ['Form', '#7248b9'],
    pdf: ['PDF', '#d93025'],
    image: ['Img', '#0b8a8a'],
    video: ['Video', '#a33ea1'],
    audio: ['Audio', '#a33ea1'],
    file: ['File', '#6b6573']
  };

  const $ = id => document.getElementById(id);
  // The trail of folders opened so far, starting with the circle's own folder.
  let trail = [];

  function el (tag, attrs, text) {
    const node = document.createElement(tag);
    Object.assign(node, attrs || {});
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function ago (iso) {
    if (!iso) return '';
    const seconds = (Date.now() - new Date(iso).getTime()) / 1000;
    const rtf = new Intl.RelativeTimeFormat(undefined, { numeric: 'auto' });
    if (seconds < 3600) return rtf.format(-Math.max(1, Math.round(seconds / 60)), 'minute');
    if (seconds < 86400) return rtf.format(-Math.round(seconds / 3600), 'hour');
    if (seconds < 86400 * 30) return rtf.format(-Math.round(seconds / 86400), 'day');
    return new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function showMessage (lines, warn) {
    $('list').hidden = true;
    $('footer').hidden = true;
    const box = $('message');
    box.hidden = false;
    box.className = 'message' + (warn ? ' warn' : '');
    box.replaceChildren(...lines.map(line => el('p', {}, line)));
  }

  function showTrail () {
    const nav = $('trail');
    nav.hidden = trail.length < 2;
    nav.replaceChildren();
    trail.forEach((folder, i) => {
      if (i > 0) nav.append(el('span', { className: 'sep' }, '/'));
      if (i === trail.length - 1) {
        nav.append(el('span', {}, folder.name));
      } else {
        const button = el('button', { type: 'button' }, folder.name);
        button.addEventListener('click', () => { trail = trail.slice(0, i + 1); load(folder.isCircleFolder ? null : folder.id); });
        nav.append(button);
      }
    });
  }

  function showItems (folder, items) {
    $('message').hidden = true;
    const list = $('list');
    list.hidden = false;
    list.replaceChildren();
    if (!items.length) {
      list.append(el('div', { className: 'message' }, 'This folder is empty.'));
    }
    for (const item of items) {
      const isFolder = item.kind === 'folder';
      const row = el(isFolder ? 'button' : 'a', { className: 'row' });
      if (isFolder) {
        row.type = 'button';
        row.addEventListener('click', () => { trail.push({ id: item.id, name: item.name }); load(item.id); });
      } else {
        row.href = item.link || '#';
        row.target = '_blank';
        row.rel = 'noopener noreferrer';
      }
      const [label, color] = KINDS[item.kind] || KINDS.file;
      const badge = el('span', { className: 'kind' }, label);
      badge.style.background = color;
      const when = el('span', { className: 'when' });
      if (item.changedAt) {
        when.append(el('span', {}, ago(item.changedAt)));
        if (item.changedBy) when.append(el('small', {}, item.changedBy));
      }
      row.append(badge, el('span', { className: 'name' }, item.name), when);
      list.append(row);
    }
    const open = $('open-drive');
    open.hidden = !folder.link;
    if (folder.link) open.href = folder.link;
    $('footer').hidden = false;
  }

  // The folder shown now: null for the circle's own folder, or a folder's id.
  let current = null;
  let canAdd = false;
  let maxUploadMb = 5120;
  let relayMb = 25;
  let busy = false;

  function setStatus (text, warn) {
    const status = $('status');
    status.textContent = text || '';
    status.className = 'status' + (warn ? ' warn' : '');
  }

  function setBusy (value) {
    busy = value;
    $('add-files').disabled = value;
    $('new-folder').disabled = value;
    $('my-folder').disabled = value;
  }

  function folderParam () {
    return current ? '&folder=' + encodeURIComponent(current) : '';
  }

  async function post (path, body) {
    const res = await fetch(BOOT.api + path, {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'X-Agora': '1' },
      body: JSON.stringify(body)
    });
    const data = await res.json().catch(() => ({}));
    return { ok: res.ok, data };
  }

  // Pieces of 8 MB. Google wants pieces in steps of 256 KB.
  const PIECE = 32 * 256 * 1024;

  // Sends one piece to Google. XMLHttpRequest instead of fetch, because only it reports how far an upload is.
  function sendPiece (url, file, start, onProgress) {
    const end = Math.min(start + PIECE, file.size);
    return new Promise(resolve => {
      const xhr = new XMLHttpRequest();
      xhr.open('PUT', url);
      xhr.setRequestHeader('Content-Range', 'bytes ' + start + '-' + (end - 1) + '/' + file.size);
      xhr.upload.onprogress = e => { if (e.lengthComputable) onProgress((start + e.loaded) / file.size); };
      // 308 means Google has this piece and waits for the next one.
      xhr.onload = () => {
        if (xhr.status === 308) {
          const range = xhr.getResponseHeader('Range');
          const got = range && range.match(/bytes=0-(\d+)/);
          resolve({ next: got ? Number(got[1]) + 1 : end });
        } else if (xhr.status >= 200 && xhr.status < 300) {
          resolve({ done: true });
        } else {
          resolve({ failed: xhr.status });
        }
      };
      xhr.onerror = () => resolve({ failed: 0 });
      xhr.send(file.slice(start, end));
    });
  }

  // Sends a file straight to Google Drive, in pieces, so big videos never pass through Agora's server.
  async function sendDirect (file, onProgress) {
    const started = await post('/upload-session', { name: file.name, type: file.type || '', size: file.size, folder: current || '' });
    if (!started.ok) return { ok: false, error: started.data.error || 'The file could not be added. Try again in a minute.' };
    let start = 0;
    let tries = 0;
    while (true) {
      const result = await sendPiece(started.data.uploadUrl, file, start, onProgress);
      if (result.done) return { ok: true };
      if (result.next !== undefined) { start = result.next; tries = 0; continue; }
      // The browser may not send to Google at all: then the first piece fails at once.
      if (start === 0 && result.failed === 0 && tries === 0) return { ok: false, blocked: true };
      if (++tries > 3) return { ok: false, error: 'The connection to Google Drive broke off. Try again.' };
      await new Promise(r => setTimeout(r, 2000 * tries));
    }
  }

  async function sendFile (file, onProgress) {
    const direct = await sendDirect(file, onProgress);
    if (direct.ok || !direct.blocked) return direct;
    if (file.size > relayMb * 1048576) {
      return { ok: false, error: 'This browser could not send the file to Google Drive. Put it in Google Drive yourself.' };
    }
    return sendThroughAgora(file, onProgress);
  }

  // Small files can also go through Agora's own server, when the browser cannot reach Google directly.
  function sendThroughAgora (file, onProgress) {
    return new Promise(resolve => {
      const xhr = new XMLHttpRequest();
      const params = '?name=' + encodeURIComponent(file.name) + '&type=' + encodeURIComponent(file.type || '') + folderParam();
      xhr.open('POST', BOOT.api + '/upload' + params);
      xhr.withCredentials = true;
      // Sent as plain bytes, so the server never tries to read the file as a form or as JSON.
      xhr.setRequestHeader('Content-Type', 'application/octet-stream');
      xhr.setRequestHeader('X-Agora', '1');
      xhr.upload.onprogress = e => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
      xhr.onload = () => {
        let body = {};
        try { body = JSON.parse(xhr.responseText); } catch (e) {}
        resolve(xhr.status >= 200 && xhr.status < 300 ? { ok: true } : { ok: false, error: body.error || 'The file could not be added. Try again in a minute.' });
      };
      xhr.onerror = () => resolve({ ok: false, error: 'The file could not be sent. Check your connection and try again.' });
      xhr.send(file);
    });
  }

  async function addFiles (files) {
    if (!canAdd || busy || !files.length) return;
    const tooLarge = files.filter(f => f.size > maxUploadMb * 1048576);
    const empty = files.filter(f => f.size === 0);
    const good = files.filter(f => f.size > 0 && f.size <= maxUploadMb * 1048576);
    setBusy(true);
    const failed = [];
    for (let i = 0; i < good.length; i++) {
      const file = good[i];
      const label = good.length > 1 ? ' (' + (i + 1) + ' of ' + good.length + ')' : '';
      setStatus('Adding ' + file.name + label + '…');
      const result = await sendFile(file, part => setStatus('Adding ' + file.name + label + ': ' + Math.round(part * 100) + '%'));
      if (!result.ok) failed.push(file.name + ': ' + result.error);
    }
    setBusy(false);
    const problems = failed
      .concat(tooLarge.map(f => f.name + ': larger than ' + maxUploadMb + ' MB, so not added. Put it in Google Drive directly.'))
      .concat(empty.map(f => f.name + ': empty, so not added.'));
    if (problems.length) setStatus(problems.join(' '), true);
    else setStatus(good.length === 1 ? 'Added.' : 'Added ' + good.length + ' files.');
    if (good.length > failed.length) {
      await post('/uploaded', { folder: current || '' }).catch(() => {});
      load(current, true);
    }
  }

  async function newFolder () {
    if (!canAdd || busy) return;
    const name = (window.prompt('Name of the new folder') || '').trim();
    if (!name) return;
    setBusy(true);
    setStatus('Making the folder…');
    try {
      const res = await post('/folder', { name, folder: current || '' });
      if (!res.ok) setStatus(res.data.error || 'The folder could not be made. Try again in a minute.', true);
      else { setStatus('Folder made.'); load(current, true); }
    } catch (e) {
      setStatus('The folder could not be made. Check your connection and try again.', true);
    }
    setBusy(false);
  }

  // Opens the folder with your own name in the folder shown now, and makes it the first time.
  async function myFolder () {
    if (!canAdd || busy) return;
    setBusy(true);
    setStatus('Opening your folder…');
    try {
      const res = await post('/my-folder', { folder: current || '' });
      if (!res.ok) setStatus(res.data.error || 'Your folder could not be opened. Try again in a minute.', true);
      else {
        setStatus('');
        trail.push({ id: res.data.item.id, name: res.data.item.name });
        load(res.data.item.id, true);
      }
    } catch (e) {
      setStatus('Your folder could not be opened. Check your connection and try again.', true);
    }
    setBusy(false);
  }

  // Leaving the page stops an upload halfway, so the browser asks first.
  window.addEventListener('beforeunload', e => { if (busy) { e.preventDefault(); e.returnValue = ''; } });

  async function load (folderId, keepStatus) {
    current = folderId || null;
    if (!keepStatus) setStatus('');
    showMessage(['Loading the files…']);
    const url = BOOT.api + '/list' + (folderId ? '?folder=' + encodeURIComponent(folderId) : '');
    let body;
    try {
      const res = await fetch(url, { credentials: 'same-origin' });
      body = await res.json().catch(() => ({}));
      if (!res.ok) return showMessage([body.error || 'The files could not be loaded. Try again in a minute.'], true);
    } catch (e) {
      return showMessage(['The files could not be loaded. Check your connection and try again.'], true);
    }
    if (!body.configured) {
      return showMessage(['Google Drive is not connected to Agora yet.', 'Once it is, the files of this circle show up here.']);
    }
    if (!body.folder) {
      return showMessage([
        'There is no folder called "' + BOOT.circleName + '" in the main 7BP folder in Google Drive yet.',
        'To add one, create a folder with exactly that name inside the main folder. It shows up here within a minute.'
      ]);
    }
    if (trail.length === 0) trail = [body.folder];
    else trail[trail.length - 1] = { ...trail[trail.length - 1], ...body.folder };
    canAdd = Boolean(body.canAdd);
    if (body.maxUploadMb) maxUploadMb = body.maxUploadMb;
    if (body.relayMb) relayMb = body.relayMb;
    $('tools').hidden = !canAdd;
    showTrail();
    showItems(body.folder, body.items || []);
  }

  $('add-files').addEventListener('click', () => $('file-input').click());
  $('file-input').addEventListener('change', e => {
    const files = Array.from(e.target.files || []);
    e.target.value = '';
    addFiles(files);
  });
  $('new-folder').addEventListener('click', newFolder);
  $('my-folder').addEventListener('click', myFolder);

  // Files can also be dropped on the list.
  const panel = $('panel');
  panel.addEventListener('dragover', e => {
    if (!canAdd || busy) return;
    e.preventDefault();
    panel.classList.add('dropping');
  });
  panel.addEventListener('dragleave', () => panel.classList.remove('dropping'));
  panel.addEventListener('drop', e => {
    panel.classList.remove('dropping');
    if (!canAdd || busy) return;
    e.preventDefault();
    // Only files can be dropped. A dropped folder fails with a message; use New folder instead.
    addFiles(Array.from((e.dataTransfer && e.dataTransfer.files) || []));
  });

  document.title = 'Files of ' + BOOT.circleName + ' · Agora';
  $('title').textContent = 'Files of ' + BOOT.circleName;
  $('back').href = BOOT.circleUrl;
  load(null);
</script>
</body>
</html>
