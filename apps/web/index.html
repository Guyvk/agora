    <link rel="apple-touch-icon" sizes="120x120" href="/apple-icon-120x120.png">

    <meta name="color-scheme" content="light dark">

    <title>Agora</title>

    <!--
      Boot indicator. Nothing paints until React mounts, and no stylesheet exists
      before then either — in dev the CSS arrives through the module graph — so a
      device in dark mode just shows the browser's dark canvas until the app is
      ready. That wait scales with latency: a few seconds on a LAN, minutes over a
      relayed connection where the dev server's ~1400 modules each cost a round
      trip. Inline here so it costs no request of its own, and delayed so a fast
      load never flashes it. React clears #root when it mounts, which removes it.
    -->
    <style>
      /* Match the boot loading screen's palette so the pre-React wait is the
         same surface the animation fades in over, not a black canvas. */
      html, body { background: #EDECE8; }
      @media (prefers-color-scheme: dark) {
        html, body { background: #2E2E2E; }
      }
      #hylo-boot-loader {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(152deg, #F4F3F1 0%, #EDECE8 55%, #E4E3DE 100%);
      }
      /* Agora: the 7 Billion Presidents mark and the word Agora. The mark is the
         7BP logo used as a stencil, so it takes the ink colour of the scheme. */
      #hylo-boot-loader { flex-direction: column; gap: 18px; }
      .agora-boot-mark {
        width: 112px;
        height: 137px;
        margin-top: -6vh;
        background: #090B0A;
        -webkit-mask: url(/agora-7bp-logo.png) center / contain no-repeat;
        mask: url(/agora-7bp-logo.png) center / contain no-repeat;
        animation: agora-boot-in 0.7s ease-out both, agora-boot-breathe 6s ease-in-out 1.2s infinite;
      }
      .agora-boot-word {
        font: 600 28px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        letter-spacing: 0.06em;
        color: #090B0A;
        animation: agora-boot-in 0.7s ease-out 0.45s both;
      }
      @keyframes agora-boot-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes agora-boot-breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }
      @media (prefers-color-scheme: dark) {
        .agora-boot-mark { background: #FFFFFF; }
        .agora-boot-word { color: #FFFFFF; }
      }
      @media (prefers-reduced-motion: reduce) {
        .agora-boot-mark, .agora-boot-word { animation: none; }
      }
      #hylo-boot-progress {
        position: absolute;
        left: 0;
        bottom: 0;
        height: 5px;
        width: 0;
        background: #090B0A;
      }
      @media (prefers-color-scheme: dark) {
        #hylo-boot-loader {
          background: linear-gradient(152deg, #3A3A3A 0%, #2E2E2E 55%, #232323 100%);
        }
        #hylo-boot-progress { background: #FFFFFF; }
      }
    </style>
  </head>
  <body>
    <!-- if the value of 'root' is ever changed, than also change the value in /src/client/util -->
    <div id="root" style="height: 100%; overflow: hidden;"></div>

    <!-- Boot loading screen. Agora: the 7BP mark and the word Agora fade up and
         breathe until the app is ready. Lives outside #root and
         runs from HTML parse, so it plays while the module graph is still
         loading; React calls window.HyloBootLoader.ready() when the view below
         has started, and the loader fades itself out and unhooks. -->
    <div id="hylo-boot-loader" role="status" aria-label="Loading"></div>
    <script>
    (function () {
      var host = document.getElementById('hylo-boot-loader')
      if (!host) return
      // Playwright sets navigator.webdriver. The overlay is outside #root at
      // z-index 2000 and holds a 2.4s minimum show, so tests can assert on
      // content underneath while screenshots still capture this splash.
      if (navigator.webdriver) {
        host.parentNode.removeChild(host)
        window.HyloBootLoader = { milestone: function () {}, ready: function () {} }
        return
      }
      // Agora: the 7BP mark and the word Agora fade up and breathe (see the CSS above).
      // This script only runs the progress bar and the fade-out once the app is ready.
      var mark = document.createElement('div')
      mark.className = 'agora-boot-mark'
      mark.setAttribute('aria-hidden', 'true')
      var word = document.createElement('div')
      word.className = 'agora-boot-word'
      word.textContent = 'Agora'
      host.appendChild(mark)
      host.appendChild(word)
      var bar = document.createElement('div')
      bar.id = 'hylo-boot-progress'
      host.appendChild(bar)

      function clamp (v, lo, hi) { return Math.min(hi, Math.max(lo, v)) }
      function inOutSine (t) { return -(Math.cos(Math.PI * t) - 1) / 2 }
      var MIN_SHOW = 1.2, FADE = 0.7

      var T = 0, last = null, readyFlag = false, fadeStart = null, stopped = false
      // Boot milestones: script running -> app modules loaded -> React mounted ->
      // session known. The bottom bar eases to each completed step's share of
      // the width, creeping toward the next so a slow step still reads as alive.
      var STEPS = 4, reachedCount = 1, reachedAt = 0, disp = 0
      var MILESTONE_INDEX = { modules: 2, react: 3, session: 4 }
      function reach (n) {
        if (n > reachedCount) { reachedCount = n; reachedAt = T }
      }
      function frame (now) {
        if (stopped) return
        var dt = 0
        if (last != null) dt = Math.min((now - last) / 1000, 0.1)
        T += dt
        last = now
        var base = reachedCount / STEPS
        var target = base
        if (reachedCount < STEPS) {
          var nextShare = (reachedCount + 1) / STEPS
          target = Math.min(nextShare - 0.02, base + (nextShare - base - 0.02) * (1 - Math.exp(-(T - reachedAt) / 5)))
        }
        disp += (target - disp) * Math.min(1, dt * 6)
        bar.style.width = (disp * 100) + 'vw'
        if (readyFlag && T >= MIN_SHOW && fadeStart == null) fadeStart = T
        if (fadeStart != null) {
          var f = 1 - inOutSine(clamp((T - fadeStart) / FADE, 0, 1))
          host.style.opacity = f
          host.style.pointerEvents = 'none'
          host.setAttribute('aria-hidden', 'true')
          if (f <= 0) {
            stopped = true
            if (host.parentNode) host.parentNode.removeChild(host)
            return
          }
        }
        window.requestAnimationFrame(frame)
      }
      // The whole lifecycle above rides requestAnimationFrame, which browsers
      // suspend entirely for hidden tabs — so a page loaded in the background
      // (or headless) would keep the loader forever, hiding the mounted app
      // and blocking anything gated on the loader being gone. Nobody sees the
      // animation in a hidden tab: once the app is ready there, just remove.
      function teardown () {
        stopped = true
        if (host.parentNode) host.parentNode.removeChild(host)
      }
      document.addEventListener('visibilitychange', function () {
        if (document.hidden && readyFlag) teardown()
      })
      window.requestAnimationFrame(frame)
      window.HyloBootLoader = {
        milestone: function (name) { reach(MILESTONE_INDEX[name] || 0) },
        ready: function () {
          reach(STEPS)
          readyFlag = true
          if (document.hidden) teardown()
        }
      }
    })()
    </script>
